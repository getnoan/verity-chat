name: ci
on: [push, pull_request]
# Read-only, stated rather than inherited: nothing here writes to the repo, and a repository
# whose default token was ever widened would otherwise hand that to every job.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: syntax
        run: for f in $(find site-web agents scripts -name '*.mjs' -o -name '*.js' | grep -v node_modules); do node --check "$f" || exit 1; done
      - name: tests
        run: for t in agents/test-*.mjs; do echo "== $t"; node "$t" || exit 1; done
      - name: keyless boot + the embed (the INSTALL.md quickstart, verified on every push)
        run: |
          NODE_ENV=test node -e "
            const { server } = await import('./site-web/server.mjs');
            server.listen(8674, '127.0.0.1', () => console.log('up'));
          " & sleep 3
          test "$(curl -s http://127.0.0.1:8674/healthz)" = "ok"
          curl -s http://127.0.0.1:8674/widget.js | grep -q "verity-chat-v1\|__verityChatLoaded"
          curl -s http://127.0.0.1:8674/widget-demo | grep -qi "<!doctype html"
  # Its own job: it needs the PR's base commit, and it answers "will the next export
  # revert this?" — a contributor should get that without waiting on the build.
  provenance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # HEAD is the PR merge commit; depth 2 makes HEAD^1 (the base tip) resolvable.
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: export provenance
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-provenance.mjs
